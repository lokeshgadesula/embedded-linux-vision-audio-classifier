name="embedded-linux-vision-audio-classifier"
version="0.1.0"
requires-python=">=3.10"
dependencies=["numpy>=1.26"]
[project.optional-dependencies]
dev=["pytest>=8"]
[tool.setuptools.packages.find]
where=["src"]
